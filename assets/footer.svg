<style>
.m{font-family:"Fira Code",Consolas,"Courier New",monospace;font-size:15px;fill:#a78bfa}
.w{animation:walk 8s linear infinite}
@keyframes walk{from{transform:translateX(-40px)}to{transform:translateX(840px)}}
.a{animation:f1 .4s steps(1) infinite}.b{animation:f2 .4s steps(1) infinite}
@keyframes f1{0%{opacity:1}50%{opacity:0}}@keyframes f2{0%{opacity:0}50%{opacity:1}}
.cur{animation:f1 1s steps(1) infinite}
.gr{animation:scroll 1s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-16px)}}
</style>
<text x="400.0" y="22" text-anchor="middle" class="m">thanks for stopping by, see you in the next level<tspan class="cur">_</tspan></text>
