<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="150.5" x2="449.5" y1="0" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#a78bfa"/><stop offset=".5" stop-color="#fdf4ff"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa"/>
<animate attributeName="x1" values="-1;1" dur="3s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="3s" repeatCount="indefinite"/></linearGradient></defs>
<style>
.t{font-family:"Fira Code",Consolas,"Courier New",monospace;font-size:22px;font-weight:700;fill:url(#sh)}
.u{stroke-dasharray:299;stroke-dashoffset:299;animation:draw 1s .2s ease-out forwards}
